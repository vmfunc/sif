id: favicon-gitea
info:
  name: Gitea Favicon Fingerprint
  author: sif
  severity: info
  description: Detects Gitea by its default favicon hash
  tags: [favicon, fingerprint, gitea, git, info]

type: http

http:
  method: GET
  # gitea moved the favicon from /img to /assets/img in v1.21; both are tried so
  # one path covers the whole live population.
  paths:
    - "{{BaseURL}}/assets/img/favicon.png"
    - "{{BaseURL}}/img/favicon.png"

  matchers:
    - type: status
      status: [200]
    - type: favicon
      hash:
        - -754147112  # v1.14 through v1.24
        - -1668137428 # v1.25 onward
