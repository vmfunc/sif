# Prometheus Alertmanager Status Exposure Detection Module

id: alertmanager-status-exposure
info:
  name: Prometheus Alertmanager Status Exposure
  author: sif
  severity: high
  description: Detects an unauthenticated Prometheus Alertmanager whose status api leaks the running config including receiver credentials
  tags: [alertmanager, prometheus, monitoring, alerting, config, exposure, unauth, recon]

type: http

http:
  method: GET
  paths:
    - "{{BaseURL}}/api/v2/status"

  matchers:
    - type: word
      part: body
      words:
        - "\"versionInfo\""
        - "\"config\""
        - "\"cluster\""
      condition: and

    - type: status
      status:
        - 200

  extractors:
    - type: regex
      name: alertmanager_version
      part: body
      regex:
        - '"versionInfo"\s*:\s*\{[^}]*"version"\s*:\s*"([^"]+)"'
      group: 1

tests:
  - name: an exposed status is flagged with its version
    response:
      status: 200
      headers:
        Content-Type: application/json
      body: >-
        {"cluster":{"name":"01HXYZ","status":"ready"},"versionInfo":{"version":"0.27.0"},"config":{"original":"global:\n"},"uptime":"x"}
    expect:
      match: true
      extracted:
        alertmanager_version: "0.27.0"
  - name: a configless status is not a leak
    response:
      status: 200
      body: '{"cluster":{"name":"x"},"versionInfo":{"version":"0.27.0"},"uptime":"x"}'
    expect:
      match: false
  - name: a 404 is not a leak
    response:
      status: 404
      body: not found
    expect:
      match: false
